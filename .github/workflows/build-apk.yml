name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm' # Защита от отвала сети: кэшируем зависимости npm

      - name: Install Project Dependencies
        run: npm install

      # Защита от ошибки отсутствия сборки или веб-директории
      - name: Ensure Web Directory Exists
        run: |
          mkdir -p www
          # Если используешь сборщик фронтенда, раскомментируй строку ниже:
          # npm run build 

      # Установка мобильного окружения Capacitor
      - name: Install Capacitor CLI & Platforms
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # Инициализация и синхронизация ресурсов сайта с Android-проектом
      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Update App Version to 1.2.0 (v2)
        run: |
          sed -i 's/versionCode [0-9]*/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.2.0"/g' android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Кэшируем Gradle, чтобы сборка не шла вечность

      # Фикс той самой знаменитой ошибки с правами доступа к Gradle сборщику
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # Компиляция чистого релизного APK-файла
      - name: Build Unsigned Release APK with Gradle
        run: |
          cd android && ./gradlew assembleRelease

      # Автоматическая подпись собранного APK ключами из секретов репозитория
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Сохранение и выгрузка готового подписанного файла в артефакты GitHub
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Anime List Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
