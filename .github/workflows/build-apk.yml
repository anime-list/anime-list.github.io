name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Установка Capacitor на сервере GitHub
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # Синхронизация папки www с Android проектом
      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      # Установка стабильной Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ХАК ДЛЯ СДК: Принудительно поднимаем версию Android SDK до 35 (Android 15).
      # Это мгновенно исправит ошибку с поиском символа VANILLA_ICE_CREAM.
      - name: Patch Android SDK Version to 35
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion.*/targetSdkVersion = 35/g' android/variables.gradle
          fi

      # Патчим файл настроек Gradle на версию 8.7
      - name: Patch Gradle Wrapper Properties to 8.7
        run: |
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          EOF

      # Запуск сборки на обновленном Gradle, Java 21 и SDK 35
      - name: Build Unsigned Release APK with Gradle
        run: |
          cd android && ./gradlew assembleRelease --no-daemon

      # Автоматическая подпись файла твоими секретами
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Выгрузка готового приложения
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anime List Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
